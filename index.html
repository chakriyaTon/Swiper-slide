<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hs4">

  <!-- Slide 1 — ✏️ Change src, title, description -->
  <div class="s on">
    <img src="https://www.kakmolspa.com/uploads/_SmartImage/img-eb3ae775192a784c02770373d2aabe09" alt="Slide 1">
    <div class="ov"></div>
    <div class="tx">
      <div class="tc">01 / 03</div>
      <div class="tt">Your First Title</div>
      <div class="td">Your description goes here — keep it short and impactful</div>
    </div>
  </div>

  <!-- Slide 2 — ✏️ Change src, title, description -->
  <div class="s">
    <img src="https://www.kakmolspa.com/uploads/_SmartImage/img-f878685f8abdbc36850cee4d360dec5b" alt="Slide 2">
    <div class="ov"></div>
    <div class="tx">
      <div class="tc">02 / 03</div>
      <div class="tt">Your Second Title</div>
      <div class="td">Another beautiful description for slide two</div>
    </div>
  </div>

  <!-- Slide 3 — ✏️ Change src, title, description -->
  <div class="s">
    <img src="https://www.kakmolspa.com/uploads/_SmartImage/img-8089cf1a4b70cb0f33b4f7997ae91b06" alt="Slide 3">
    <div class="ov"></div>
    <div class="tx">
      <div class="tc">03 / 03</div>
      <div class="tt">Your Third Title</div>
      <div class="td">A compelling description for your third slide</div>
    </div>
  </div>

  <button class="arr prv" aria-label="Previous slide">&#8592;</button>
  <button class="arr nxt" aria-label="Next slide">&#8594;</button>

  <div class="dots"></div>

  <div class="ring">
    <svg viewBox="0 0 46 46"><circle class="rbg" cx="23" cy="23" r="20"/></svg>
    <svg viewBox="0 0 46 46"><circle class="rfg" id="hs4rfg" cx="23" cy="23" r="20"/></svg>
    <span id="hs4rtx"></span>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
